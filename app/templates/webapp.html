.btns { display: flex; gap: 10px; margin-top: 12px; }

/* ── api ───────────────────────────────────────────────────────────── */
function apiUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  let u = `${baseUrl}/webapp/api${path}${sep}bot_id=${botId}`;
  if (sessionToken) u += `&session=${encodeURIComponent(sessionToken)}`;
  return u;
}
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (initData) headers['X-Telegram-Init-Data'] = initData;
  const r = await fetch(apiUrl(path), { method, headers, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(d.detail || 'Error'); err.code = d.code || (r.status === 503 ? 'SERVICE_UNAVAILABLE' : ''); throw err; }
  return d;
}

/* ── theme ─────────────────────────────────────────────────────────── */
function applyTheme() {
  const scheme = Tg.colorScheme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.body.classList.toggle('light', scheme === 'light');
  const p = Tg.themeParams || {};
  const map = { bg_color: '--bg', text_color: '--text', hint_color: '--muted', section_bg_color: '--surface', secondary_bg_color: '--surface-2' };
  for (const k in map) if (p[k]) document.documentElement.style.setProperty(map[k], p[k]);
}
applyTheme(); Tg.onEvent('themeChanged', applyTheme);

function go(name) {
  if (!user) return;
  if (!user.registered && name !== 'register') name = 'register';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tabbar button, .rail button').forEach(b => b.classList.remove('active'));
  const v = $('view' + name[0].toUpperCase() + name.slice(1)); if (v) { v.classList.remove('active'); void v.offsetWidth; v.classList.add('active'); }
  const tabKey = ['returns', 'bonuses', 'balance'].includes(name) ? 'more' : name;
  $('tab_' + tabKey)?.classList.add('active');
  document.querySelector(`.rail button[data-page="${name}"]`)?.classList.add('active');
  page = name; window.scrollTo({ top: 0 }); haptic('tap');
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  ({ cabinet: loadCabinet, payments: loadPayments, shipments: loadShipments, returns: loadReturns,
     bonuses: loadBonuses, balance: loadBalance, akt: loadAkt, more: loadMore, register: showRegister })[name]?.();
}

      <div class="tile"><div class="l">➖ ${L('used')}</div><div class="n">${money(d.used)}</div></div></div>
      ${d.items.length ? `<div class="card"><div class="eyebrow" style="margin-bottom:8px">${L('history')}</div><div class="tl">
        ${d.items.map(i => `<div class="it ${i.kind === 'accrued' ? 'plus' : 'minus'}"><span class="dot"></span>
          <div class="d"><b class="num">${i.date}</b><small>${esc(i.note || '')}</small></div>
          <span class="a">${i.kind === 'accrued' ? '+' : '−'}${moneyT(i.amount)}</span></div>`).join('')}
      </div></div>` : empty(L('emptyBon'))}
    </div>`;
  } catch (e) { $('viewBonuses').innerHTML = errBox(e, 'loadBonuses()'); }
}

    const d = await api('GET', '/balance');

      <div class="card"><div class="kv"><span class="k">${L('asOf')}</span><span class="v num">${esc(d.as_of)}</span></div></div>
      <div class="btns" style="margin-top:0"><button class="btn ghost" onclick="go('akt')">${I.akt} ${L('akt')}</button><button class="btn ghost" onclick="go('payments')">${I.payments} ${L('payments')}</button></div>
    </div>`;
  } catch (e) { $('viewBalance').innerHTML = errBox(e, 'loadBalance()'); }

/* ── 📄 akt sverka ─────────────────────────────────────────────────── */
function aktPresets() {
  // Sana MAHALLIY vaqt bo'yicha formatlanadi: toISOString() UTC ga o'tkazib,
  // UTC+5 da oy boshini oldingi oyning oxirgi kuniga surib yuborardi.
  const t = new Date();
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const m1 = new Date(t.getFullYear(), t.getMonth(), 1);
  const pm1 = new Date(t.getFullYear(), t.getMonth() - 1, 1), pm2 = new Date(t.getFullYear(), t.getMonth(), 0);
  const m3 = new Date(t.getFullYear(), t.getMonth() - 2, 1);
  const y1 = new Date(t.getFullYear(), 0, 1);
  return { m: [iso(m1), iso(t)], pm: [iso(pm1), iso(pm2)], m3: [iso(m3), iso(t)], y: [iso(y1), iso(t)] };
}
function setAkt(preset) {
  akt.preset = preset; haptic('tap');
  if (preset === 'custom') { renderAktCustom(); return; }
  const [f, to] = aktPresets()[preset];
  akt.from = f; akt.to = to;
  renderAkt();
}
function aktChips() {
  const C = [['m', L('thisM')], ['pm', L('prevM')], ['m3', L('m3')], ['y', L('year')], ['custom', '✏️ ' + L('custom')]];
  return `<div class="chips">${C.map(([k, l]) => `<button class="chip ${akt.preset === k ? 'active' : ''}" onclick="setAkt('${k}')">${l}</button>`).join('')}</div>`;
}
function loadAkt() {
  if (!akt.from) { const [f, t2] = aktPresets().m; akt.from = f; akt.to = t2; akt.preset = 'm'; }
  if (akt.preset === 'custom') renderAktCustom(); else renderAkt();
}
function renderAktCustom() {
  $('viewAkt').innerHTML = `<h2 class="t">${L('akt')}</h2>${aktChips()}
    <div class="card">
      <div class="field"><label>${L('from')}</label><input class="input num" type="date" id="aktFrom" value="${akt.from || ''}"></div>
      <div class="field"><label>${L('to')}</label><input class="input num" type="date" id="aktTo" value="${akt.to || ''}"></div>
      <button class="btn primary" onclick="aktCustomShow()">${L('show')}</button>
    </div>`;
}
function aktCustomShow() {
  const f = $('aktFrom').value, t2 = $('aktTo').value;
  if (!f || !t2) return;
  akt.from = f; akt.to = t2;
  renderAkt();
}
async function renderAkt() {
  load('viewAkt');
  try {
    const d = await api('GET', `/akt-sverka?date_from=${akt.from}&date_to=${akt.to}`);
    const pdfPath = `/akt-sverka/pdf?date_from=${d.date_from_iso}&date_to=${d.date_to_iso}&lang=${lng}`;
    $('viewAkt').innerHTML = `<h2 class="t">${L('akt')}</h2>${aktChips()}
      <div class="stagger">
      <div class="card"><div class="kv" style="padding-top:0"><span class="k">${L('period')}</span><span class="v num">${d.date_from} — ${d.date_to}</span></div>
        <div class="kv"><span class="k">${L('opening')}</span><span class="v">${money(d.opening_balance)}</span></div>
        <div class="kv"><span class="k">➕ ${L('debit')}</span><span class="v" style="color:var(--paid)">${money(d.total_debit)}</span></div>
        <div class="kv"><span class="k">➖ ${L('credit')}</span><span class="v" style="color:var(--late)">${money(d.total_credit)}</span></div>
        <div class="kv" style="padding-bottom:0"><span class="k"><b>${L('closing')}</b></span><span class="v" style="font-size:16px">${money(d.closing_balance)}</span></div>
      </div>
      ${d.rows.length ? `<div class="card"><div class="eyebrow" style="margin-bottom:8px">${L('moves')} · ${d.rows.length}</div><div class="tl">
        ${d.rows.map(r => `<div class="it ${r.debit ? 'plus' : 'minus'}"><span class="dot"></span>
          <div class="d"><b class="num">${r.date} · ${esc(r.doc)}</b><small>${esc(r.note)}</small></div>
          <span class="a">${r.debit ? '+' + moneyT(r.debit) : '−' + moneyT(r.credit)}</span></div>`).join('')}
      </div></div>` : note('info', L('emptyAkt'))}
      <button class="btn primary" id="pdfBtn" onclick="downloadPdf('${pdfPath}', '${d.date_from_iso}_${d.date_to_iso}')">${L('pdf')}</button>
      </div>`;
  } catch (e) { $('viewAkt').innerHTML = `<h2 class="t">${L('akt')}</h2>${aktChips()}` + errBox(e, 'renderAkt()'); }
}
function openLink(u) { try { Tg.openLink(u); } catch (e) { window.open(u, '_blank'); } }
async function downloadPdf(path, period) {
  // Brauzer sessiyasida to'g'ridan-to'g'ri havola (auth query'da);
  // Telegram Mini App ichida initData faqat header'da yuriladi → blob orqali.
  if (sessionToken) { openLink(apiUrl(path)); return; }
  const btn = $('pdfBtn'); if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const headers = {}; if (initData) headers['X-Telegram-Init-Data'] = initData;
    const r = await fetch(apiUrl(path), { headers });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || 'PDF error'); }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `akt_sverka_${period}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('PDF ✓');
  } catch (e) { toast(e.message, 'err'); }
  if (btn) { btn.disabled = false; btn.textContent = L('pdf'); }
}

}

/* ── init ──────────────────────────────────────────────────────────── */
async function init() {
  buildNav();
  load('viewCabinet');
  try {
    user = await api('GET', '/user');
    if (user.language && !localStorage.getItem('mx_lang')) { lng = user.language; localStorage.setItem('mx_lang', lng); buildNav(); }
    setHeader(user.company_name, user.supplier_id);
    if (user.registered) $('railOut').style.display = '';
    const h = (location.hash || '').slice(1);
    const known = ['cabinet', 'payments', 'shipments', 'returns', 'bonuses', 'balance', 'akt', 'more'];
    go(user.registered ? (known.includes(h) ? h : 'cabinet') : 'register');
  } catch (e) {
    $('viewCabinet').innerHTML = `<div class="empty"><div class="em">🔒</div><b>${L('noAccessB')}</b><span>${esc(e.message)}${L('noAccessS')}</span></div>`;
  }
}
init();
